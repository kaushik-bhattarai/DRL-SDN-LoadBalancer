# DRL-SDN Load Balancer Configuration

# Controller settings
controller_url: "http://127.0.0.1:8080/sdrlb"

# DRL Agent Configuration
drl:
  state_dim: 9            # 3 servers * 3 features (connections, load, delta)
  action_dim: 3           # Select h1, h2, or h3
  hidden_dim: 64          # Neural network hidden layer size
  epsilon_start: 1.0      # Initial exploration rate
  epsilon_min: 0.05       # Minimum exploration rate
  epsilon_decay: 0.9998   # Per-step decay: 0.9998^15000 ≈ 0.05 (~500 episodes × 30 steps)
  learning_rate: 0.0003   # Reduced learning rate for stability

# Training Configuration
training:
  episodes: 200           # Number of training episodes
  episode_duration: 30    # Duration of each episode in seconds
  batch_size: 32          # Batch size for training
  memory_size: 10000      # Replay buffer size
  gamma: 0.99             # Discount factor for future rewards

  # Phase 3: Synthetic failure injection during training
  failure_injection:
    enabled: true
    start_episode: 50        # Begin injection after basic policy is learned
    probability: 0.3         # 30% of episodes after start_episode get a failure
    duration_steps: 8        # ~8 seconds of simulated failure per injection
    multi_server_prob: 0.1   # 10% chance of killing 2 servers simultaneously

  # Phase 5: Prioritized Experience Replay (conditional — see gate check)
  per:
    enabled: false           # Enable only if Phase 3+4 gap persists at N=30
    alpha: 0.6               # Priority exponent
    beta_start: 0.4          # IS weight exponent (annealed to 1.0)
    beta_increment: 0.001    # Per-step beta annealing

# Reward Function Weights
training_reward_weights:
  alpha: 1.0              # Weight for latency (reduced from 10.0)
  beta: 0.5               # Weight for variance (reduced from 1.0)

# Traffic Generation Configuration (for training)
traffic:
  enabled: true
  patterns:
    - type: "constant"
      rate: 100            # requests per second
      duration: 30
    
    - type: "bursty"
      base_rate: 50
      burst_rate: 500
      burst_duration: 5    # seconds
      burst_interval: 15   # seconds between bursts
      duration: 60
    
    - type: "incremental"
      start_rate: 50
      end_rate: 500
      duration: 60
    
    - type: "sinusoidal"
      base_rate: 100
      amplitude: 200
      period: 60           # seconds for one full cycle
      duration: 120

# Network Topology (informational)
topology:
  num_servers: 3          # Active servers (h1, h2, h3)
  num_edge_switches: 8    # Edge switches (200-207)
  fat_tree_k: 4           # Fat-tree parameter

# Evaluation Settings
evaluation:
  num_episodes: 10
  episode_duration: 30

# Logging
logging:
  save_interval: 10       # Save checkpoint every N episodes
  log_interval: 1         # Print stats every N episodes

# Inference (controller startup load + inference.py)
inference:
  enabled: true
  model_path: "models/final/dqn_final.pth"

# Phase 4: Heuristic fallback with hysteresis
# Thresholds are derived from fallback_threshold_sweep.py crossover experiment.
# Set to null until sweep is complete, which disables fallback.
fallback:
  enabled: false
  engage_threshold: null     # failures/window to switch from DRL → LC
  disengage_threshold: null  # failures/window to switch back DRL (< engage)
  observation_window: 60     # seconds
  algorithm: "least_connections"